<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HelMcore s.r.o. | Radar verejných zákaziek</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #f59e0b;
      --green: #10b981;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; max-width: 1100px; margin: 0 auto; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 20px; gap: 12px; }
    h1 { font-size: 1.4rem; letter-spacing: 0.5px; }
    h1 span { color: var(--accent); }
    .badge-info { font-size: 0.85rem; color: var(--muted); }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    input, select { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; border-radius: 8px; font-size: 0.95rem; }
    input { flex: 1; min-width: 220px; }
    .grid { display: grid; gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; transition: border-color 0.2s; }
    .card:hover { border-color: var(--accent); }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
    .score { background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid var(--green); padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 0.85rem; white-space: nowrap; }
    .source { background: #334155; color: #e2e8f0; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; margin-right: 8px; }
    .title { font-size: 1.1rem; font-weight: 600; line-height: 1.4; margin-top: 6px; }
    .meta { display: flex; flex-wrap: wrap; gap: 16px; font-size: 0.9rem; color: var(--muted); margin: 12px 0; padding: 10px; background: rgba(15, 23, 42, 0.5); border-radius: 8px; }
    .meta strong { color: var(--text); }
    .summary { font-size: 0.95rem; line-height: 1.5; color: #cbd5e1; margin-bottom: 10px; }
    .advantage { font-size: 0.88rem; color: var(--green); margin-bottom: 6px; }
    .risk { font-size: 0.88rem; color: #fca5a5; margin-bottom: 14px; }
    .btn { display: inline-block; background: var(--accent); color: #0f172a; font-weight: 700; text-decoration: none; padding: 9px 16px; border-radius: 8px; font-size: 0.9rem; }
    .empty { text-align: center; padding: 40px; color: var(--muted); border: 1px dashed var(--border); border-radius: 12px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1><span>HelMcore</span> s.r.o. – Tender Radar</h1>
      <div class="badge-info">Filter: Východné Slovensko (KE/PO kraj) | Nad 5 000 € bez DPH | JOSEPHINE + ÚVO</div>
    </div>
    <div id="count" class="badge-info">Načítavam...</div>
  </header>

  <div class="controls">
    <input type="text" id="search" placeholder="Hľadať (napr. Prešov, rozvádzač, EPS, bleskozvod)..." />
    <select id="sourceFilter">
      <option value="ALL">Všetky zdroje</option>
      <option value="JOSEPHINE">Len JOSEPHINE</option>
      <option value="ÚVO">Len ÚVO</option>
    </select>
  </div>

  <div id="list" class="grid"></div>

  <script>
    let allTenders = [];

    function formatEur(val) {
      if (!val || val <= 0) return "Neuvedená (odhad > 5 000 €)";
      return new Intl.NumberFormat("sk-SK").format(val) + " € bez DPH";
    }

    function render() {
      const q = document.getElementById("search").value.toLowerCase();
      const src = document.getElementById("sourceFilter").value;
      const list = document.getElementById("list");

      const filtered = allTenders.filter(t => {
        const matchSrc = src === "ALL" || t.source === src;
        const matchText = !q ||
          t.title.toLowerCase().includes(q) ||
          t.location.toLowerCase().includes(q) ||
          t.summary.toLowerCase().includes(q);
        return matchSrc && matchText;
      });

      document.getElementById("count").textContent = `Zobrazených: ${filtered.length} zákaziek`;

      if (filtered.length === 0) {
        list.innerHTML = `<div class="empty">Zatiaľ žiadne zákazky zodpovedajúce filtru. Systém kontroluje portály každý deň o 7:30 a 14:30.</div>`;
        return;
      }

      list.innerHTML = filtered.map(t => `
        <div class="card">
          <div class="card-top">
            <div>
              <span class="source">${t.source}</span>
              <span style="font-size:0.8rem; color:#94a3b8;">Pridané: ${t.found_at}</span>
              <div class="title">${t.title}</div>
            </div>
            <div class="score">Zhoda ${t.score} %</div>
          </div>
          <div class="meta">
            <div>📍 Lokalita: <strong>${t.location}</strong></div>
            <div>💶 Hodnota: <strong>${formatEur(t.estimated_value_eur)}</strong></div>
            <div>⏳ Termín: <strong>${t.deadline}</strong></div>
          </div>
          <div class="summary">${t.summary}</div>
          <div class="advantage">✅ Výhoda: ${t.helmcore_advantage}</div>
          <div class="risk">⚠️ Riziká: ${t.risks}</div>
          <a class="btn" href="${t.url}" target="_blank" rel="noopener">Otvoriť podklady na portáli →</a>
        </div>
      `).join("");
    }

    fetch("tenders.json?t=" + Date.now())
      .then(r => r.json())
      .then(data => { allTenders = data; render(); })
      .catch(() => {
        document.getElementById("list").innerHTML = `<div class="empty">Databáza zákaziek čaká na prvé spustenie skriptu.</div>`;
      });

    document.getElementById("search").addEventListener("input", render);
    document.getElementById("sourceFilter").addEventListener("change", render);
  </script>
</body>
</html>
