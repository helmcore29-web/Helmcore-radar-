<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HelMcore s.r.o. | Tender Radar</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: rgba(30, 41, 59, 0.92);
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #f59e0b;
      --green: #10b981;
      --red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      padding: 16px;
      min-height: 100vh;
      position: relative;
    }

    /* Vodoznak loga v strede pozadia */
    body::before {
      content: "";
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 75vw;
      max-width: 420px;
      height: 75vw;
      max-height: 420px;
      background: url('logo.png') no-repeat center center;
      background-size: contain;
      opacity: 0.07;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    header {
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 14px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 8px;
    }

    .brand-logo {
      width: 52px;
      height: 52px;
      object-fit: contain;
      flex-shrink: 0;
      border-radius: 8px;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.25;
    }

    h1 span { color: var(--accent); }

    .subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .counter {
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 600;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    input, select {
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      flex: 1;
      min-width: 200px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      backdrop-filter: blur(4px);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .source-badge {
      font-weight: 700;
      color: var(--text);
    }

    .score-badge {
      border: 1px solid var(--green);
      color: var(--green);
      padding: 2px 10px;
      border-radius: 999px;
      font-weight: 700;
      white-space: nowrap;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: #fff;
    }

    .meta {
      font-size: 0.88rem;
      margin-bottom: 10px;
      display: grid;
      gap: 4px;
    }

    .summary {
      font-size: 0.9rem;
      color: #cbd5e1;
      margin-bottom: 12px;
      padding-top: 8px;
      border-top: 1px solid rgba(51, 65, 85, 0.6);
    }

    .pros-cons {
      font-size: 0.86rem;
      display: grid;
      gap: 6px;
      margin-bottom: 14px;
    }

    .btn {
      display: inline-block;
      background: #7f1d1d;
      color: #fff;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      text-align: center;
      width: 100%;
    }

    .btn:hover { background: #991b1b; }
    .empty { text-align: center; color: var(--muted); padding: 30px 0; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand-row">
        <img src="logo.png" alt="HelMcore" class="brand-logo" onerror="this.style.display='none'">
        <h1><span>HelMcore</span> s.r.o. – Tender Radar</h1>
      </div>
      <div class="subtitle">Filter: Východné Slovensko (KE/PO kraj) | Nad 5 000 € bez DPH | JOSEPHINE + ÚVO + B2B</div>
      <div class="counter" id="counter">Načítavam zákazky...</div>
    </header>

    <div class="controls">
      <input type="text" id="searchInput" placeholder="Hľadať (napr. Prešov, rozvádzač, EPS, blesk)..." />
      <select id="sourceFilter">
        <option value="ALL">Všetky zdroje</option>
        <option value="JOSEPHINE">Len JOSEPHINE</option>
        <option value="ÚVO / EVO">Len ÚVO / EVO</option>
        <option value="B2B / Subdodávka">Len B2B / Subdodávky</option>
      </select>
    </div>

    <div id="list"></div>
  </div>

  <script>
    let allTenders = [];

    function formatEur(val) {
      if (!val || val <= 0) return "Neuvedená (odhad > 5 000 €)";
      return Number(val).toLocaleString("sk-SK") + " € bez DPH";
    }

    function render() {
      const q = document.getElementById("searchInput").value.toLowerCase().trim();
      const src = document.getElementById("sourceFilter").value;
      const list = document.getElementById("list");

      const filtered = allTenders.filter(t => {
        if (src !== "ALL" && t.source !== src) return false;
        if (!q) return true;
        const hay = `${t.title} ${t.location} ${t.summary} ${t.source}`.toLowerCase();
        return hay.includes(q);
      });

      document.getElementById("counter").textContent = `Zobrazených: ${filtered.length} zákaziek`;

      if (!filtered.length) {
        list.innerHTML = `<div class="empty">Žiadne zákazky nezodpovedajú zvolenému filtru.</div>`;
        return;
      }

      list.innerHTML = filtered.map(t => `
        <div class="card">
          <div class="card-top">
            <div><span class="source-badge">${t.source}</span> &nbsp;|&nbsp; Pridané: ${t.found_at || "-"}</div>
            <div class="score-badge">Zhoda ${t.score} %</div>
          </div>
          <div class="card-title">${t.title}</div>
          <div class="meta">
            <div>📍 Lokalita: <strong>${t.location}</strong></div>
            <div>💶 Hodnota: <strong>${formatEur(t.estimated_value_eur)}</strong></div>
            <div>⏳ Termín: <strong>${t.deadline || "Podľa portálu"}</strong></div>
          </div>
          <div class="summary">${t.summary}</div>
          <div class="pros-cons">
            <div>✅ <strong>Výhoda:</strong> ${t.helmcore_advantage}</div>
            <div>⚠️ <strong>Riziká:</strong> ${t.risks}</div>
          </div>
          <a href="${t.url}" target="_blank" rel="noopener" class="btn">Otvoriť podklady na portáli →</a>
        </div>
      `).join("");
    }

    fetch("tenders.json?v=" + Date.now())
      .then(r => r.json())
      .then(data => {
        allTenders = data.filter(item => item.source !== "Daibau.sk");
        render();
      })
      .catch(() => {
        document.getElementById("counter").textContent = "Chyba načítania dát.";
      });

    document.getElementById("searchInput").addEventListener("input", render);
    document.getElementById("sourceFilter").addEventListener("change", render);
  </script>
</body>
</html>
